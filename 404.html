<!--
  GitHub Pages hands this file back for any path it does not have, at whatever depth the
  visitor typed -- /a/b/c as readily as /typo. So every path here is absolute from the
  site root, where the other four pages use relative ones. A relative "assets/site.css"
  would resolve against the made-up folder and this page would arrive unstyled exactly
  when it is trying to look trustworthy.

  That is also why check.js leaves this page out of its header comparison: the difference
  is the point, not drift.
-->

<script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('lb.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
