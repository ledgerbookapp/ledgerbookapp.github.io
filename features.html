<!DOCTYPE html>

<!-- Bengali needs a font that has it. Without this the page falls back to whatever the
     phone has, which on a good many Android builds renders matras a step out of place. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Before the stylesheet paints, so a reader who chose the theme that is not their
     system's never sees the other one flash first. Small enough to stay inline; a
     separate file would be a round trip in front of the first paint. -->
<script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('lb.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>

<link rel="stylesheet" href="assets/site.css">

<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="./">
      <span class="brand-tile"><svg viewBox="22 22 64 64" aria-hidden="true" fill="currentColor">
        <rect x="52" y="26" width="4" height="56" rx="2"/>
        <rect x="26" y="40" width="22" height="8" rx="4"/>
        <rect x="26" y="58" width="22" height="8" rx="4"/>
        <rect x="60" y="40" width="22" height="8" rx="4"/>
        <rect x="60" y="58" width="22" height="8" rx="4"/>
      </svg></span>
      <b data-s="appName">LedgerBook</b>
    </a>
    <nav id="nav">
      <a href="./" data-s="navHome">Home</a>
      <a href="features.html" aria-current="page" data-s="navFeatures">Features</a>
      <a href="install.html" data-s="navInstall">How to install</a>
      <a href="privacy.html" data-s="navPrivacy">Privacy</a>
    </nav>
    <div class="switches">
      <button id="lang" type="button">বাংলা</button>
      <button id="theme" type="button" aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <a class="btn btn-pill" data-dl href="https://github.com/oslraahat/ledgerbook-releases/releases"
         data-s="navDownload">Download</a>
      <button id="menu" type="button" aria-expanded="false" aria-controls="nav" aria-label="Open the menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <path class="m-top" d="M4 8h16"/><path class="m-bot" d="M4 16h16"/>
        </svg>
      </button>
    </div>
  </div>
</header>

        <figure class="shot">
          <img class="s-light" src="assets/screens/app-home-light.png" width="540" height="1212" loading="lazy" alt="">
          <img class="s-dark"  src="assets/screens/app-home-dark.png"  width="540" height="1212" loading="lazy" alt="">
          <figcaption data-s="shotHome">The first screen</figcaption>
        </figure>
        <figure class="shot">
          <img class="s-light" src="assets/screens/app-txn-light.png" width="540" height="1212" loading="lazy" alt="">
          <img class="s-dark"  src="assets/screens/app-txn-dark.png"  width="540" height="1212" loading="lazy" alt="">

          <img class="s-light" src="assets/screens/app-accounts-light.png" width="540" height="1212" loading="lazy" alt="">

        <figure class="shot">
          <img class="s-light" src="assets/screens/app-analytics-light.png" width="540" height="1212" loading="lazy" alt="">
          <img class="s-dark"  src="assets/screens/app-analytics-dark.png"  width="540" height="1212" loading="lazy" alt="">
          <figcaption data-s="shotAnalytics">Where the month went</figcaption>
        </figure>
        <figure class="shot">
          <img class="s-light" src="assets/screens/app-backup-light.png" width="540" height="1212" loading="lazy" alt="">
          <img class="s-dark"  src="assets/screens/app-backup-dark.png"  width="540" height="1212" loading="lazy" alt="">
          <figcaption data-s="shotBackup">Backup and restore</figcaption>
        </figure>
