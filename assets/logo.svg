<?xml version="1.0" encoding="UTF-8"?>
<!--
  The LedgerBook mark: a wallet holding the ledger book and a taka note.

  Drawn to the owner's pick from the logo canvas, "09H — Money ledger": the wallet is the
  app's own, the one on its PIN screens; standing in it are the book it keeps and a
  note, the money the book is about.

  The canvas writes the taka sign as a letter in a web font. A picture made of this
  file cannot load a font, so on a phone without a Bengali face that letter would come
  out as an empty box; here it is drawn as a line instead, the same everywhere.

  This is the full mark, for 40 device pixels and up — the header shows it at 32, but
  only on a screen where 32 is 64 or more. favicon.svg is the simplified cut for 24
  and 16, where the stitching, the note's border and the sign come to half a pixel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108"
     role="img" aria-labelledby="t">
  <title id="t">LedgerBook</title>
  <rect width="108" height="108" rx="26" fill="#F2B830"/>
  <g transform="translate(0 2)">
    <g transform="rotate(9 66 24)">
      <rect x="46" y="12" width="40" height="25" rx="3.5" fill="#8B6A1F"/>
      <rect x="49.5" y="15.5" width="33" height="18" rx="2" fill="none" stroke="#F2B830" stroke-width="1" opacity="0.7"/>
      <circle cx="72" cy="24.5" r="6.5" fill="#F2B830"/>
      <g transform="translate(64.9 17.3) scale(0.135)" fill="none" stroke="#0C0B0A" stroke-width="11"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 30 C30 22 40 21 46 26 L50 30 V68 C50 80 58 86 67 86 C77 86 82 78 80 70"/>
        <path d="M34 46 H70"/>
      </g>
    </g>
    <g transform="rotate(-7 44 30)">
      <rect x="22" y="12" width="42" height="36" rx="5" fill="#0C0B0A"/>
      <rect x="29" y="12" width="2" height="36" fill="#8B6A1F"/>
      <rect x="42" y="18" width="16" height="3.5" rx="1.75" fill="#8B6A1F"/>
      <g fill="#F2B830">
        <rect x="36" y="25" width="22" height="4" rx="2"/>
        <rect x="36" y="31" width="22" height="4" rx="2"/>
      </g>
    </g>
    <rect x="21" y="40" width="66" height="50" rx="12" fill="#F2B830" stroke="#0C0B0A" stroke-width="5"/>
    <path d="M62 48 H37 A8 8 0 0 0 29 56 V74 A8 8 0 0 0 37 82 H62" fill="none" stroke="#0C0B0A"
          stroke-width="2" stroke-dasharray="3.2 3.2" stroke-linecap="round"/>
    <path d="M88 54.5 H73 A10.5 10.5 0 0 0 73 75.5 H88 Z" fill="#0C0B0A"/>
    <circle cx="73.5" cy="65" r="5" fill="#F2B830"/>
    <circle cx="73.5" cy="65" r="2" fill="#0C0B0A"/>
  </g>
</svg>
