<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installing LedgerBook</title>
<meta name="description" content="Four steps to install LedgerBook on Android, and what the two warnings along the way mean.">

<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="canonical" href="https://ledgerbookapp.github.io/install.html">

<meta property="og:type" content="website">
<meta property="og:site_name" content="LedgerBook">
<meta property="og:title" content="Installing LedgerBook">
<meta property="og:description" content="Four steps to install LedgerBook on Android, and what the two warnings along the way mean.">
<meta property="og:url" content="https://ledgerbookapp.github.io/install.html">
<meta property="og:image" content="https://ledgerbookapp.github.io/assets/icon-512.png">
<meta name="twitter:card" content="summary">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Before the stylesheet paints, so a reader who chose the theme that is not their
     system's never sees the other one flash first. Small enough to stay inline; a
     separate file would be a round trip in front of the first paint. -->
<script>try{var t=localStorage.getItem('lb.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>

<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="./">
      <svg viewBox="0 0 108 108" aria-hidden="true" fill="currentColor">
        <rect x="52" y="26" width="4" height="56" rx="2"/>
        <rect x="26" y="40" width="22" height="8" rx="4"/>
        <rect x="26" y="58" width="22" height="8" rx="4"/>
        <rect x="60" y="40" width="22" height="8" rx="4"/>
        <rect x="60" y="58" width="22" height="8" rx="4"/>
      </svg>
      <b data-s="appName">LedgerBook</b>
    </a>
    <nav>
      <a href="./" data-s="navHome">Home</a>
      <a href="features.html" data-s="navFeatures">Features</a>
      <a href="install.html" aria-current="page" data-s="navInstall">How to install</a>
      <a href="privacy.html" data-s="navPrivacy">Privacy</a>
    </nav>
    <div class="switches">
      <button id="theme" type="button" aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <button id="lang" type="button">বাংলা</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <section class="hero" style="padding-bottom:20px">
      <h1 data-s="installTitle">Installing LedgerBook</h1>
      <p class="lead" data-s="installLead"></p>
      <div class="cta">
        <a class="btn" id="dl" href="https://github.com/oslraahat/ledgerbook-releases/releases"
           data-s="downloadAlt">Open the releases page</a>
      </div>
      <p class="meta" id="dl-meta"></p>
    </section>

    <section>
      <ol class="steps">
        <li><h3 data-s="step1Head">Download the file</h3><p data-s="step1Body"></p>
          <figure><img src="assets/screens/step1-download.png" alt="" loading="lazy" width="536" height="304"><figcaption data-s="cap1"></figcaption></figure></li>
        <li><h3 data-s="step2Head">Open it</h3><p data-s="step2Body"></p>
          <figure><img src="assets/screens/step2-permission.png" alt="" loading="lazy" width="481" height="426"><figcaption data-s="cap2"></figcaption></figure>
          <figure><img src="assets/screens/step2-allow.png" alt="" loading="lazy" width="510" height="415"><figcaption data-s="cap2b"></figcaption></figure></li>
        <li><h3 data-s="step3Head">Install</h3><p data-s="step3Body"></p>
          <figure><img src="assets/screens/step3-install.png" alt="" loading="lazy" width="481" height="327"><figcaption data-s="cap3"></figcaption></figure>
          <figure><img src="assets/screens/step3-protect.png" alt="" loading="lazy" width="499" height="649"><figcaption data-s="cap3b"></figcaption></figure>
          <figure><img src="assets/screens/step3-safe.png" alt="" loading="lazy" width="499" height="643"><figcaption data-s="cap3c"></figcaption></figure></li>
        <li><h3 data-s="step4Head">Set your PIN</h3><p data-s="step4Body"></p>
          <figure><img src="assets/screens/step4-pin.png" alt="" loading="lazy" width="540" height="900"><figcaption data-s="cap4"></figcaption></figure></li>
      </ol>
    </section>

    <section>
      <h2 data-s="verifyTitle">Checking you got the right file</h2>
      <div class="card">
        <p data-s="verifyBody" style="margin-bottom:14px"></p>
        <!-- Filled from the release body once the API answers; empty until then, which is
             honest -- a fingerprint printed from memory would be worse than none. -->
        <code class="hash" id="dl-hash"></code>
      </div>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">
    <p data-s="footerNote"></p>
    <p><a href="https://github.com/oslraahat/ledgerbook-releases/releases" data-s="allVersions">All versions</a></p>
  </div>
</footer>

<script src="assets/strings.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
