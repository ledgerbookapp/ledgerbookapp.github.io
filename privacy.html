<!-- Bengali needs a font that has it. Without this the page falls back to whatever the
     phone has, which on a good many Android builds renders matras a step out of place. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Before the stylesheet paints, so a reader who chose the theme that is not their
     system's never sees the other one flash first. Small enough to stay inline; a
     separate file would be a round trip in front of the first paint. -->
<script>try{var t=localStorage.getItem('lb.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>

<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="./">
      <svg viewBox="0 0 108 108" aria-hidden="true" fill="currentColor">
        <rect x="52" y="26" width="4" height="56" rx="2"/>
        <rect x="26" y="40" width="22" height="8" rx="4"/>
        <rect x="26" y="58" width="22" height="8" rx="4"/>
        <rect x="60" y="40" width="22" height="8" rx="4"/>
        <rect x="60" y="58" width="22" height="8" rx="4"/>
      </svg>
      <b data-s="appName">LedgerBook</b>
    </a>
    <nav>
      <a href="./" data-s="navHome">Home</a>
      <a href="features.html" data-s="navFeatures">Features</a>
      <a href="install.html" data-s="navInstall">How to install</a>
      <a href="privacy.html" aria-current="page" data-s="navPrivacy">Privacy</a>
    </nav>
    <div class="switches">
      <button id="theme" type="button" aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <button id="lang" type="button">বাংলা</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <section class="hero" style="padding-bottom:16px">
      <h1 data-s="navPrivacy">Privacy</h1>
      <p class="lead" data-s="privLead"></p>
    </section>

      <div class="card"><p data-s="privCollectBody"></p></div>
    </section>

    <section>

      <div class="card"><p data-s="privWhereBody"></p></div>
    </section>

    <section>

      <div class="card"><p data-s="privNetBody"></p></div>
    </section>

    <section>
      <h2 data-s="permTitle">What it asks for, and why</h2>
      <div class="card">
        <table>
          <tr><th data-s="permInternet">Internet</th><td data-s="permInternetW"></td></tr>
          <tr><th data-s="permNotify">Notifications</th><td data-s="permNotifyW"></td></tr>
          <tr><th data-s="permContacts">Contacts</th><td data-s="permContactsW"></td></tr>
          <tr><th data-s="permInstall">Install apps</th><td data-s="permInstallW"></td></tr>
        </table>
      </div>
    </section>

    </section>

      <div class="card"><p data-s="privDeleteBody"></p></div>
    </section>

  </div>
